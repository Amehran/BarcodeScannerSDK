name: Android CI

on:
  push:
    branches: [ stage, develop, refactor/cleanup ]
  pull_request:
    branches: [ stage, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: false
        
    - name: Run unit tests
      run: ./gradlew test --continue --build-cache --configuration-cache
      
    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: |
          app/build/reports/tests/
          scanner/build/reports/tests/
          app/build/test-results/
          scanner/build/test-results/
        retention-days: 30



