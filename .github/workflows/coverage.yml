name: Code Coverage

on:
  push:
    branches: [ main, stage, develop ]
  pull_request:
    branches: [ main, stage, develop ]

jobs:
  coverage:
    name: Generate Code Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run tests with coverage
      run: ./gradlew testDebugUnitTest jacocoTestReport --continue
      
    - name: Generate coverage report
      run: ./gradlew jacocoTestReport
      
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: |
          app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          scanner/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
        fail_ci_if_error: false
        verbose: true
        
    - name: Upload coverage HTML reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: |
          app/build/reports/jacoco/
          scanner/build/reports/jacoco/
        retention-days: 30
        
    - name: Add coverage comment to PR
      uses: madrapps/jacoco-report@v1.6.1
      if: github.event_name == 'pull_request'
      with:
        paths: |
          ${{ github.workspace }}/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml,
          ${{ github.workspace }}/scanner/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 70
        min-coverage-changed-files: 80
